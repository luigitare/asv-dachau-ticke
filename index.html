<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASV Dachau Volleyball – Spielplan &amp; Live-Ticker</title>
    <style>
      :root { font-family: Inter, system-ui, -apple-system, sans-serif; color: #111827; background: #f4f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 1rem; }
      header { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
      .logo {
        width: 42px; height: 42px; border-radius: 50%;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: .8rem;
      }
      h1 { font-size: 1.15rem; margin: 0; }
      .sub { color: #6b7280; font-size: .85rem; }

      /* Mannschafts-Auswahl */
      .teambar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
      .teambtn {
        border: 1px solid #d1d5db; background: #fff; border-radius: 999px;
        padding: .45rem 1rem; font-size: .9rem; cursor: pointer;
      }
      .teambtn.active { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }

      /* Unter-Tabs pro Mannschaft */
      .tabbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
      .tabbtn {
        border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
        padding: .4rem .9rem; font-size: .85rem; cursor: pointer;
      }
      .tabbtn.active { background: #2563eb; border-color: #2563eb; color: #fff; }

      .team { display: none; }
      .team.active { display: block; }
      .tabpane { display: none; }
      .tabpane.active { display: block; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; overflow-x: auto; }
      .ticker-frame { width: 100%; height: 640px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
      .fallback { margin-top: .6rem; font-size: .82rem; color: #6b7280; display: none; }
      .fallback a { color: #1e3a8a; }
      .note { font-size: .78rem; color: #9ca3af; margin-top: 1rem; }

      /* styling, das die BVV-Schnittstelle in die Tabellen schreibt */
      .vapi table { border-collapse: collapse; width: 100%; font-size: .85rem; }
      .vapi th, .vapi td { border: 1px solid #e5e7eb; padding: .35rem .5rem; text-align: left; white-space: nowrap; display: table-cell !important; }
      .vapi th { background: #f1f5f9; }
      .vapi tr.marked td { background: #eff6ff; font-weight: 600; }
      .vapi tr.eigenesheimspiel td { background: #fefce8; }
      /* Team-Spalten dürfen nie ausgeblendet werden (auch nicht durch
         mitgeladenes CSS der Schnittstelle auf kleinen Displays) */
      .vapi .team, .vapi .teama, .vapi .teamb { display: table-cell !important; max-width: 45vw; white-space: normal !important; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">ASV</div>
      <div>
        <h1>ASV Dachau Volleyball – Spielplan &amp; Live-Ticker</h1>
        <div class="sub">Daten automatisch vom BVV-Ergebnisdienst</div>
      </div>
    </header>

    <div class="teambar" id="teambar"></div>
    <div id="teams"></div>

    <p class="note">
      Datenquelle: BVV-Ergebnisschnittstelle (api.volleyball-bayern.de) ·
      Live-Ticker: bvv.sams-ticker.de (Matchseries-UUID = Wettbewerbs-Id aus dem BVV-Portal).
    </p>

    <details style="margin-top:1.5rem; background:#fff; border:1px dashed #9ca3af; border-radius:8px; padding:.75rem;">
      <summary style="cursor:pointer; font-weight:600; font-size:.85rem;">🔧 Debug-Ausgabe (vorübergehend)</summary>
      <textarea id="debug-out" readonly style="width:100%; height:180px; font-size:.7rem; font-family:monospace;"></textarea>
      <textarea id="probe-out" readonly style="width:100%; height:220px; margin-top:.5rem; font-size:.7rem; font-family:monospace;" placeholder="Sondierung läuft..."></textarea>
      <button id="probe-btn" style="margin-top:.5rem; padding:.4rem .8rem; font-size:.8rem; cursor:pointer;">📡 Sondierung starten</button>
    </details>

    <script>
      // ================================================================
      // KONFIGURATION – pro Mannschaft ein Eintrag.
      // Wettbewerb-Id + Team-Id: BVV-Portal -> Vereinshomepage ->
      // Hallenergebnisse. Die Matchseries-URL des Tickers ergibt sich
      // automatisch aus der Wettbewerb-Id.
      // ================================================================
      const CONFIG = [
        {
          name: "U16 weiblich",
          league: "U16 Bezirksliga weiblich",
          wettbewerb: "c7a7d183-b089-47c4-a0b8-cf7c625acf4a",
          teamId: "9d1d1f61-f8a9-4119-a96f-5db53f20c8e4",
        },
        // Weitere Teams einfach ergänzen, z.B.:
        {
          name: "U16 männlich (ASV Dachau III)",
          league: "U16 Südliga 3/4 männlich",
          wettbewerb: "697b5a4a-09ad-4d03-9ceb-67c25998e305",
          teamId: "73465466-072c-4b9f-a07f-b398c2971070",
        },
      ];

      const TICKER_BASE = "https://bvv.sams-ticker.de/matchseries/";

      // ---------- UI aus der Konfiguration bauen ----------
      const teambar = document.getElementById("teambar");
      const teamsRoot = document.getElementById("teams");

      CONFIG.forEach((t, ti) => {
        // Mannschafts-Button
        const b = document.createElement("button");
        b.className = "teambtn" + (ti === 0 ? " active" : "");
        b.textContent = t.name;
        b.dataset.team = "team-" + ti;
        b.onclick = () => selectTeam(b);
        teambar.appendChild(b);

        // Mannschafts-Container mit 3 Unter-Tabs
        const wrap = document.createElement("div");
        wrap.className = "team" + (ti === 0 ? " active" : "");
        wrap.id = "team-" + ti;

        const tabs = document.createElement("div");
        tabs.className = "tabbar";
        tabs.innerHTML = `
          <button class="tabbtn active" data-pane="t-${ti}-ticker">Live-Ticker</button>
          <button class="tabbtn" data-pane="t-${ti}-spiele">Spielplan</button>
          <button class="tabbtn" data-pane="t-${ti}-tabelle">Tabelle</button>`;
        wrap.appendChild(tabs);

        // --- Tab 1: Live-Ticker (iframe, Matchseries-URL aus Wettbewerb-Id) ---
        const tickerPane = document.createElement("div");
        tickerPane.className = "tabpane active";
        tickerPane.id = "t-" + ti + "-ticker";
        tickerPane.innerHTML = `
          <div class="card">
            <iframe class="ticker-frame"
                    src="${TICKER_BASE}${t.wettbewerb}"
                    title="BVV Live-Ticker ${t.league}"
                    allow="fullscreen"></iframe>
            <p class="fallback">
              Der Ticker lässt sich hier nicht direkt einbetten –
              <a href="${TICKER_BASE}${t.wettbewerb}" target="_blank" rel="noopener">hier in einem neuen Tab öffnen ↗</a>
            </p>
          </div>`;
        wrap.appendChild(tickerPane);

        // --- Tab 2: Spielplan (nur eigene Spiele, gefiltert auf Team-Id) ---
        const spielePane = document.createElement("div");
        spielePane.className = "tabpane";
        spielePane.id = "t-" + ti + "-spiele";
        spielePane.innerHTML = `
          <div class="card">
            <div class="vapi"
                 data-wettbewerb="${t.wettbewerb}"
                 data-typ="spiele"
                 data-vapi-teams="[${t.teamId}]"
                 data-vapi-teamfilter="[${t.teamId}]"
                 data-vapi-heimspielkennzeichen="(H)">
            </div>
          </div>`;
        wrap.appendChild(spielePane);

        // --- Tab 3: Tabelle (eigenes Team farblich markiert) ---
        const tabPane = document.createElement("div");
        tabPane.className = "tabpane";
        tabPane.id = "t-" + ti + "-tabelle";
        tabPane.innerHTML = `
          <div class="card">
            <div class="vapi"
                 data-wettbewerb="${t.wettbewerb}"
                 data-typ="tabelle"
                 data-vapi-teams="[${t.teamId}]">
            </div>
          </div>`;
        wrap.appendChild(tabPane);

        // Unter-Tabs umschalten
        tabs.querySelectorAll(".tabbtn").forEach((btn) => {
          btn.onclick = () => {
            tabs.querySelectorAll(".tabbtn").forEach((x) => x.classList.remove("active"));
            btn.classList.add("active");
            wrap.querySelectorAll(".tabpane").forEach((p) => p.classList.remove("active"));
            document.getElementById(btn.dataset.pane).classList.add("active");
          };
        });

        teamsRoot.appendChild(wrap);
      });

      function selectTeam(btn) {
        document.querySelectorAll(".teambtn").forEach((x) => x.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".team").forEach((p) => p.classList.remove("active"));
        document.getElementById(btn.dataset.team).classList.add("active");
      }

      // Fallback erkennen: Wenn der Ticker das Einbetten sperrt
      setTimeout(() => {
        document.querySelectorAll(".ticker-frame").forEach((f) => {
          try { if (f.contentWindow === null) f.parentElement.querySelector(".fallback").style.display = "block"; }
          catch (e) { f.parentElement.querySelector(".fallback").style.display = "block"; }
        });
      }, 5000);

      // Debug: gefüllte Tabellen einsammeln (vorübergehend)
      function dumpDebug() {
        const parts = [];
        document.querySelectorAll(".vapi").forEach((el, i) => {
          parts.push("=== Container " + (i + 1) + " ===\n" + el.innerHTML);
        });
        const out = document.getElementById("debug-out");
        if (out) out.value = parts.join("\n\n").slice(0, 50000);
      }
      setTimeout(dumpDebug, 3000);
      setTimeout(dumpDebug, 8000);

      // ================================================================
      // 📡 Sondierung: Kandidaten-URLs testen und Rohdaten sichtbar
      // machen (vorübergehend). Findet die Daten-URLs, die die
      // Schnittstelle / der Ticker benutzen.
      // ================================================================
      const KEY = "ff8671c3-ef58-433d-93c5-0f1e580c4347";
      const W = CONFIG[0].wettbewerb; // Test-Wettbewerb (U16 weiblich)
      const W2 = CONFIG.length > 1 ? CONFIG[1].wettbewerb : W;

      const PROBES = [
        // Daten-URLs der BVV-Schnittstelle (wahrscheinlichste Kandidaten)
        `https://api.volleyball-bayern.de/jsi/data.php?key=${KEY}&wettbewerb=${W}&typ=spiele`,
        `https://api.volleyball-bayern.de/jsi/data.php?key=${KEY}&wettbewerb=${W}&typ=tabelle`,
        `https://api.volleyball-bayern.de/jsi/volley.php?key=${KEY}&wettbewerb=${W}&typ=spiele`,
        `https://api.volleyball-bayern.de/jsi/volley.js.php?key=${KEY}`,
        // Direktaufruf ohne "jsi"
        `https://api.volleyball-bayern.de/data.php?key=${KEY}&wettbewerb=${W}&typ=spiele`,
        // Ticker-Kandidaten (JSON-API des SPAs?)
        `https://bvv.sams-ticker.de/api/matchseries/${W}`,
        `https://bvv.sams-ticker.de/api/v1/matchseries/${W}`,
        `https://bvv.sams-ticker.de/api/matches?matchSeries=${W}`,
        `https://bvv.sams-ticker.de/api/config`,
        `https://bvv.sams-ticker.de/data/matches.json`,
        `https://bvv.sams-ticker.de/api/v1/matches`,
      ];

      async function probe() {
        const out = document.getElementById("probe-out");
        if (!out) return;
        out.value = "Sondiere " + PROBES.length + " URLs ...\n";
        for (const url of PROBES) {
          const line = "→ " + url.replace(KEY, "KEY...").split("?")[0] + "?... ";
          try {
            const res = await fetch(url);
            const text = (await res.text()).slice(0, 900);
            out.value += line + "[OK " + res.status + "]\n" + text + "\n----\n";
          } catch (e) {
            out.value += line + "[FEHLER: " + (e && e.message ? e.message : e) + "]\n----\n";
          }
        }
        out.value += "\n✅ Sondierung fertig. Bitte alles hier kopieren/screenshoten.";
      }
      document.getElementById("probe-btn").onclick = probe;
      setTimeout(probe, 2500);
    </script>

    <!-- BVV-Schnittstelle: füllt alle .vapi-Container automatisch -->
    <script src="https://api.volleyball-bayern.de/jsi/volley.js.php?key=ff8671c3-ef58-433d-93c5-0f1e580c4347"></script>
  </body>
</html>
