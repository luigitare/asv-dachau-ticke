      * { box-sizing: border-box; }
      body { margin: 0; padding: .75rem; }
      .topbar {
        position: sticky; top: 0; z-index: 200;
        background: #f4f6f8; padding-bottom: .2rem;
      }
      .topbar header { position: relative; display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; white-space: nowrap; }
      .tabbarRow {
        position: sticky; top: 50px; z-index: 199;
        background: #f4f6f8; padding: .15rem 0 .4rem; margin-bottom: .5rem;
      }
      .logo { height: 40px; width: auto; flex-shrink: 0; display: block; }
      .mpSep { border-top: 1px solid #e5e7eb; margin: .7rem 0 .2rem; }
      .menufoot { display: flex; justify-content: flex-end; margin-top: .6rem; }
      .nofilterbtn {
        border: 1px solid #d1d5db; background: #fff; border-radius: 999px;
        padding: .4rem .9rem; font-size: .8rem; cursor: pointer;
      }
      .closebtn {
        width: 100%; margin-top: .6rem; border: 1px solid #d1d5db; background: #f9fafb;
        border-radius: 10px; padding: .45rem; font-size: .82rem; cursor: pointer;
      }
      .rowlabel2 { font-size: .65rem; color: #9ca3af; text-transform: uppercase; letter-spacing: .06em; margin: .2rem 0 .35rem; }

      /* Mittiger Menü-Knopf, Menü blendet ÜBER den Inhalt */
      .menubtn {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        border: 1px solid #d1d5db; background: #fff; border-radius: 999px;
        padding: .45rem 1.1rem; font-size: .85rem; font-weight: 600; cursor: pointer;
        display: flex; align-items: center; gap: .4rem;
      }
      .menubtn.open { background: #eff6ff; border-color: #2563eb; }
      .menupanel {
        position: absolute; top: calc(100% - .2rem); left: 0; right: 0;
        opacity: 0; transform: translateY(-6px); pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;
      }
      .menupanel.open { opacity: 1; transform: none; pointer-events: auto; }
      .menupanel .card {
        padding: .8rem; border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,.18);
        max-height: 75vh; overflow-y: auto;
      }
      h1 { font-size: .95rem; margin: 0; display: inline; }
      .sub { color: #6b7280; font-size: .78rem; margin-left: .35rem; }

      .filterrow { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .4rem; align-items: center; }
      .filterrow .rowlabel { font-size: .7rem; color: #9ca3af; width: 100%; margin-bottom: -.15rem; }
      .chip {
        border: 1px solid #d1d5db; background: #fff; border-radius: 999px;
        padding: .3rem .7rem; font-size: .8rem; cursor: pointer;
      }
      .chip.active { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }

      .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
      .panel.open { grid-template-rows: 1fr; }
      .panel > div { overflow: hidden; }
      .panel .filterrow { margin: 0 0 .4rem; padding-top: .1rem; }


      .teamview { margin-top: .75rem; }
      .teamtitle { font-size: 1rem; font-weight: 700; margin: .25rem 0 .5rem; }
      .teamtitle small { color: #6b7280; font-weight: 400; }

      .tabbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
      .tabbtn {
        border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
        padding: .4rem .9rem; font-size: .85rem; cursor: pointer;
      }
      .tabbtn.active { background: #2563eb; border-color: #2563eb; color: #fff; }

      .entry { display: none; }
      .entry.active { display: block; }
      .tabpane { display: none; }
      .tabpane.active { display: block; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; overflow-x: auto; }
      .card.wide { border-radius: 10px; padding: .4rem; overflow: visible; }
      /* Schwebende Steuerung unten rechts (Pin + Neu laden) */
      .floatbar {
        position: fixed; right: 14px; bottom: 14px; z-index: 300;
        display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      }
      .fab, .fabbig {
        border: none; background: #1e3a8a; color: #fff; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.3);
        display: flex; align-items: center; justify-content: center;
      }
      .fab { width: 46px; height: 46px; border-radius: 999px; font-size: 1.05rem; }
      .fab.active { outline: 3px solid #93c5fd; }
      .fabbig {
        height: 46px; border-radius: 999px; padding: 0 1.1rem; gap: .4rem;
        font-size: .85rem; font-weight: 600;
      }

      /* Pin-Bereich: klappt nur bei Bedarf auf */
      .pinwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; margin: 0 0 .2rem; }
      .pinwrap.open { grid-template-rows: 1fr; }
      .pinwrap > div { overflow: hidden; }
      .pinrow { display: flex; gap: .4rem; margin: 0 0 .4rem; padding: 0 .25rem; flex-wrap: wrap; align-items: center; }
      .pinrow input {
        flex: 1; min-width: 200px; border: 1px solid #d1d5db; border-radius: 8px;
        padding: .35rem .5rem; font-size: .78rem;
      }
      .pinrow button {
        border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
        padding: .35rem .6rem; font-size: .78rem; cursor: pointer;
      }
      .pinrow .hint {
        width: 100%; font-size: .78rem; line-height: 1.45; color: #374151;
        background: #f3f4f6; border-radius: 8px; padding: .5rem .6rem;
      }
      .pinrow .hint b { color: #1e3a8a; }
      .ticker-frame { width: 100%; height: 640px; border: none; background: #fff; }
      .fallback { margin-top: .6rem; font-size: .82rem; color: #6b7280; display: none; }
      .fallback a { color: #1e3a8a; }
      .note { font-size: .78rem; color: #9ca3af; margin-top: 1rem; }

      /* styling, das die BVV-Schnittstelle in die Tabellen schreibt */
      .vapi table { border-collapse: collapse; width: 100%; font-size: .85rem; }
      .vapi th, .vapi td { border: 1px solid #e5e7eb; padding: .35rem .5rem; text-align: left; white-space: nowrap; display: table-cell !important; }
      .vapi th { background: #f1f5f9; }
      .vapi tr.marked td { background: #eff6ff; font-weight: 600; }
      .vapi tr.eigenesheimspiel td { background: #fefce8; }
      .vapi .team, .vapi .teama, .vapi .teamb { display: table-cell !important; max-width: 45vw; white-space: normal !important; }
      /* Spielplan-Zeilen klickbar (öffnen BVV-Spieldetail mit Live-Ticker) */
      .vapi tr.spiel.clickable { cursor: pointer; }
      .vapi tr.spiel.clickable:hover td { background: #dbeafe; }

        { cat: "jw", grp: "U20", team: "ASV Dachau", league: "Regionalmeisterschaft SO U20 weiblich", wettbewerb: "c65fa4de-5361-4ae9-a15c-5810a5ad0252", teamId: "43ec99d0-1521-4224-8444-1cc91acd283f" },
        { cat: "jw", grp: "U20", team: "ASV Dachau II", league: "U20 Bezirksliga weiblich", wettbewerb: "d0b78033-2e7c-491d-ac72-1e71f059b8a5", teamId: "8f88770c-e359-4cf3-91de-9f6620371167" },
        { cat: "jw", grp: "U20", team: "ASV Dachau III", league: "U20 Bezirksklasse 1 weiblich", wettbewerb: "906589ab-7222-4fbd-9f1b-12b36862517b", teamId: "bc3dbf98-e90e-46a8-82e5-98539f2df30d" },

        { cat: "jw", grp: "U16", team: "ASV Dachau III", league: "U16 Bezirksklasse 1 weiblich", wettbewerb: "4e072a0c-8b29-4ab3-b771-a881ec13a085", teamId: "c3872cef-745b-46f5-8394-7bacf748552a" },
        { cat: "jw", grp: "U14", team: "ASV Dachau", league: "U14 Bezirksliga weiblich", wettbewerb: "92040698-62a0-4624-8eb5-8e8159210cb7", teamId: "bf39aabb-7cd9-4718-ab9d-548c1bcdeecd" },
        { cat: "jw", grp: "U14", team: "ASV Dachau II", league: "U14 Bezirksklasse 1 weiblich", wettbewerb: "c5402641-3050-4552-9940-a66129e9ef71", teamId: "b19ee961-e908-4792-b1eb-fabe650e8e43" },
        { cat: "jw", grp: "U14", team: "ASV Dachau III", league: "U14 Bezirksklasse 1 weiblich", wettbewerb: "c5402641-3050-4552-9940-a66129e9ef71", teamId: "fb015bbf-372c-4932-81fc-b55d024d295a" },
        { cat: "jw", grp: "U13", team: "ASV Dachau", league: "U13 Kreisliga West weiblich", wettbewerb: "e377847f-0db9-47f0-b500-2b3ee8ae40c2", teamId: "f89f2bb1-a036-4549-96d2-3672d9490806" },
        { cat: "jw", grp: "U13", team: "ASV Dachau II", league: "U13 Kreisliga West weiblich", wettbewerb: "e377847f-0db9-47f0-b500-2b3ee8ae40c2", teamId: "31eb997b-4879-4313-8095-486aa629a29f" },
        { cat: "jw", grp: "U13", team: "ASV Dachau III", league: "U13 Kreisliga West weiblich", wettbewerb: "e377847f-0db9-47f0-b500-2b3ee8ae40c2", teamId: "76d4424e-f35a-456f-b2e1-cd29fc4c0e0c" },
        { cat: "jw", grp: "U12", team: "ASV Dachau", league: "U12 Kreisliga West weiblich", wettbewerb: "9883e3cd-c1ea-45ec-93c4-0d439ec372f4", teamId: "22014cb0-8ca0-410c-9dd4-5f74c51cf5d7" },
        { cat: "jw", grp: "U12", team: "ASV Dachau II", league: "U12 Kreisliga West weiblich", wettbewerb: "9883e3cd-c1ea-45ec-93c4-0d439ec372f4", teamId: "c57102ca-7468-43f7-8c1b-b0cdc1a13c55" },
      ];

      const CATS = [
        { id: "h", label: "Herren" },
        { id: "d", label: "Damen" },
        { id: "jm", label: "Jugend M" },
        { id: "jw", label: "Jugend W" },
      ];
      // Reihenfolge der Stufe-2-Filter
      const GRP_ORDER = { jm: ["U12", "U13", "U14", "U16", "U18"], jw: ["U12", "U13", "U14", "U16", "U18", "U20"] };

      const TICKER_BASE = "https://bvv.sams-ticker.de/matchseries/";
      // Ticker-ID pro Eintrag: Standard = Wettbewerb-Id aus dem Portal.
      // Für Ligen, bei denen der Ticker diese ID nicht kennt (zeigt
      // dann "heutige Spiele" von allen Ligen), die richtige
      // Matchseries-UUID im Eintrag als "tickerId" nachtragen
      // (im Ticker auf die Liga navigieren und die URL kopieren).
      const tickerIdOf = (t) => t.tickerId || t.wettbewerb;

      // ---------------- Angepinnte Spiel-Ticker ----------------
      // Pro Team kann eine Detail-URL (bvv.sams-ticker.de/detail/...)
      // gespeichert werden: Beim Laden startet der Ticker dann direkt
      // in diesem Spiel und überlebt Neuladen/Tab schließen.
      const PIN_KEY = "asv-dachau-pins-v1";
      let pins = {};
      try { pins = JSON.parse(localStorage.getItem(PIN_KEY) || "{}") || {}; } catch (e) { pins = {}; }
      function pinOf(idx) { return pins[String(idx)] || ""; }
      function setPin(idx, url) {
        if (url) pins[String(idx)] = url; else delete pins[String(idx)];
        try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (e) { }
      }
      function targetSrc(t) { return pinOf(t.idx) || t.externalUrl || (TICKER_BASE + tickerIdOf(t)); }
      // Spieldetail-Link (klickbare Spielplan-Zeilen). Verifiziert für
      // Jugend-Ligen; für Erwachsenen/Mixed ist der Pfad noch unklar
      // -> dort vorerst kein Klick (detailBase leer).
      const SPIELDETAIL_JUGEND = "https://volleyball.bayern/ergebnisse/jugend/ueberbezirkliche-meisterschaften/spiel-";
      const detailBaseOf = (e) => (e.cat === "jm" || e.cat === "jw") ? SPIELDETAIL_JUGEND : null;

      // ---------------- Auswahl-Status ----------------
      // Beim Start: nichts ausgewählt. Falls gespeichert, wird die
      // letzte Auswahl aus dem localStorage wiederhergestellt
      // (überlebt Tab schließen & Browser-Neustart, ohne Cookie-Alarm).
      let state = { cat: null, grp: null, entry: null, noFilter: false, lastGrpByCat: {}, lastEntryByGrp: {} };
      const STORE_KEY = "asv-dachau-auswahl-v1";
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (saved && typeof saved === "object") state = Object.assign(
          { cat: null, grp: null, entry: null, noFilter: false, lastGrpByCat: {}, lastEntryByGrp: {} }, saved
        );
      } catch (e) { /* ignorieren */ }

      function rememberGrp(cat, grp) { state.lastGrpByCat[cat] = grp; }
      function rememberEntry(cat, grp, idx) {
        state.lastEntryByGrp[cat + "|" + grp] = idx;
        rememberGrp(cat, grp);
      }

      function saveState() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorieren */ }
      }

      // ---------------- Views vorbereiten ----------------
      const teamview = document.getElementById("teamview");

      // Für jeden Config-Eintrag einen (versteckten) Container bauen.
      // Alle .vapi-Container existieren von Anfang an, damit das
      // BVV-Skript sie beim Laden füllen kann; die iframes werden
      // erst beim ersten Anzeigen geladen (Performance).
      CONFIG.forEach((t, i) => {
        t.idx = i;
        const el = document.createElement("div");
        el.className = "entry";
        el.id = "entry-" + i;
        el.innerHTML = `
          <div class="tabpane" id="e-${i}-ticker">
            <div class="card wide">
              <div class="pinwrap"><div>
                <div class="pinrow">
                  <input type="url" placeholder="Hier Spiel-Link einfügen (bvv.sams-ticker.de/detail/…)" />
                  <button class="pinsave">anpinnen</button>
                  <button class="pinclear">✕</button>
                  <span class="hint"></span>
                </div>
              </div></div>
              <iframe class="ticker-frame" title="BVV Live-Ticker ${t.league}" allow="fullscreen"></iframe>
              <p class="fallback">
                Der Ticker lässt sich hier nicht direkt einbetten –
                <a class="fallback-link" target="_blank" rel="noopener">hier in einem neuen Tab öffnen ↗</a>
              </p>
            </div>
          </div>
          ${t.wettbewerb ? `
          <div class="tabpane" id="e-${i}-spiele">
            <div class="card">
              <div class="vapi"
                   data-wettbewerb="${t.wettbewerb}"
                   data-typ="spiele"
                   data-vapi-teams="[${t.teamId}]"
                   data-vapi-teamfilter="[${t.teamId}]"
                   data-vapi-heimspielkennzeichen="(H)">
              </div>
            </div>
          </div>
          <div class="tabpane" id="e-${i}-tabelle">
            <div class="card">
              <div class="vapi"
                   data-wettbewerb="${t.wettbewerb}"
                   data-typ="tabelle"
                   data-vapi-teams="[${t.teamId}]">
              </div>
            </div>
          </div>` : ""}`;
        teamview.appendChild(el);
        t.el = el;

        // Klick außerhalb des Menüs schließt das Overlay
      document.addEventListener("click", (ev) => {
        if (!menuOpen) return;
        if (menuPanel.contains(ev.target) || menuBtn.contains(ev.target)) return;
        menuOpen = false;
        renderAll();
      });

        // Neu laden: wird vom schwebenden Knopf unten rechts ausgelöst
        el._reload = () => {
          const f = el.querySelector(".ticker-frame");
          const src = targetSrc(t);
          f.src = "about:blank";
          setTimeout(() => { f.src = src; }, 50);
        };

        // Pin: Spiel-Detail-URL pro Team speichern/löschen
        const pinWrap = el.querySelector(".pinwrap");
        const pinInput = el.querySelector(".pinrow input");
        const pinHint = el.querySelector(".pinrow .hint");
        el._pinToggle = () => pinWrap.classList.toggle("open");
        const setPinHint = () => {
          const p = pinOf(t.idx);
          // Solange ein Pin gesetzt ist, bleibt der Bereich offen sichtbar
          pinWrap.classList.toggle("open", !!p);
          pinHint.innerHTML = p
            ? "📌 Dieses Spiel ist angepinnt: <b>" + p.replace("https://bvv.sams-ticker.de/", "") + "</b> – der Ticker zeigt es direkt an. Mit ✕ entfernen."
            : "📋 <b>So fixierst du ein bestimmtes Spiel:</b><br>1. Im Ticker auf das Spiel tippen (bzw. Spielstand lange drücken → „Link kopieren“ / „URL kopieren“).<br>2. Den kopierten Link hier einfügen und „anpinnen“.<br>Der Ticker zeigt dann genau dieses Spiel statt der ganzen Liga – ideal am Spieltag. 📌";
        };
        setPinHint();
        el.querySelector(".pinsave").onclick = () => {
          let v = pinInput.value.trim();
          // Großzügig sein: auch ohne "https://" eingefügte Links akzeptieren
          if (/^bvv\.sams-ticker\.de\/detail\/.+/.test(v)) v = "https://" + v;
          if (!/^https:\/\/bvv\.sams-ticker\.de\/detail\/.+/.test(v)) {
            pinHint.textContent = "⚠️ Das sieht nicht nach einem Spiel-Link aus. Er sollte mit bvv.sams-ticker.de/detail/… beginnen (z. B. durch „URL kopieren“ im Ticker).";
            return;
          }
          setPin(t.idx, v);
          setPinHint();
          const f = el.querySelector(".ticker-frame");
          f.src = "about:blank";
          setTimeout(() => { f.src = v; }, 50);
        };
        el.querySelector(".pinclear").onclick = () => {
          setPin(t.idx, "");
          pinInput.value = "";
          setPinHint();
          const f = el.querySelector(".ticker-frame");
          f.src = "about:blank";
          setTimeout(() => { f.src = targetSrc(t); }, 50);
        };
      });

      // Kurz-Label für Stufe 3: "ASV Dachau III" -> "ASV III" usw.
      const shortLabel = (team) => team
        .replace("ASV Dachau U18 m II", "ASV U18 II")
        .replace("ASV Dachau U18 m", "ASV U18 I")
        .replace("ASV Dachau VIII", "ASV VIII")
        .replace("ASV Dachau VII", "ASV VII")
        .replace("ASV Dachau VI", "ASV VI")
        .replace("ASV Dachau V", "ASV V")
        .replace("ASV Dachau IV", "ASV IV")
        .replace("ASV Dachau III", "ASV III")
        .replace("ASV Dachau II", "ASV II")
        .replace("ASV Dachau", "ASV I");

      // ---------------- Auswahl: klassische Chip-Reihen im Menü ----------------
      const menuBtn = document.getElementById("menuBtn");
      const menuBtnLabel = document.getElementById("menuBtnLabel");
      const menuPanel = document.getElementById("menuPanel");
      const tabRow = document.getElementById("tabRow");
      // Menü beim ersten Besuch ohne Auswahl automatisch öffnen
      let menuOpen = state.entry === null;
      menuBtn.onclick = () => { menuOpen = !menuOpen; renderAll(); };
      document.getElementById("menuCloseBtn").onclick = () => { menuOpen = false; renderAll(); };

      // Ohne ASV-Filter: nur der BVV-Ticker mit allen Spielen
      const noFilterView = document.getElementById("nofilterview");
      const nfFrame = document.getElementById("nfFrame");
      const floatPin = document.getElementById("floatPin");
      const floatReload = document.getElementById("floatReload");
      const floatBar = document.querySelector(".floatbar");
      // Schwebende Knöpfe: nur in der Ticker-Ansicht sinnvoll
      function updateFloatbar() {
        const tickerActive = state.noFilter
          || (state.entry !== null && (state.tab || "ticker") === "ticker");
        floatBar.style.display = tickerActive ? "flex" : "none";
      }
      // Schwebende Knöpfe wirken auf die gerade aktive Ansicht
      floatPin.onclick = () => {
        const act = document.querySelector(".entry.active");
        if (act && act._pinToggle) act._pinToggle();
      };
      floatReload.onclick = () => {
        const act = document.querySelector(".entry.active");
        if (act && act._reload) act._reload();
      };
      document.getElementById("noFilterBtn").onclick = () => {
        state.noFilter = true;
        state.cat = null; state.grp = null; state.entry = null;
        menuOpen = false;
        renderAll();
      };
      noFilterView._reload = () => {
        nfFrame.src = "about:blank";
        setTimeout(() => { nfFrame.src = nfTargetSrc(); }, 50);
      };

      // Pin für die "Ohne ASV-Filter"-Ansicht (eigener Speicherplatz)
      const nfPinWrap = document.getElementById("nfPinWrap");
      const nfPinInput = document.getElementById("nfPinInput");
      const nfPinHint = document.getElementById("nfPinHint");
      noFilterView._pinToggle = () => nfPinWrap.classList.toggle("open");
      const NF_URL = "https://bvv.sams-ticker.de/";
      function nfTargetSrc() { return pinOf("nofilter") || NF_URL; }
      function nfSetPinHint() {
        const p = pinOf("nofilter");
        // Solange ein Pin gesetzt ist, bleibt der Bereich offen sichtbar
        nfPinWrap.classList.toggle("open", !!p);
        nfPinHint.innerHTML = p
          ? "📌 Dieses Spiel ist angepinnt: <b>" + p.replace("https://bvv.sams-ticker.de/", "") + "</b> – der Ticker zeigt es direkt an. Mit ✕ entfernen."
            : "📋 <b>So fixierst du ein bestimmtes Spiel:</b><br>1. Im Ticker auf das Spiel tippen (bzw. Spielstand lange drücken → „Link kopieren“ / „URL kopieren“).<br>2. Den kopierten Link hier einfügen und „anpinnen“.<br>Der Ticker zeigt dann genau dieses Spiel – auch fremde Vereine. 📌";
      }
      nfSetPinHint();
      document.getElementById("nfPinSave").onclick = () => {
        let v = nfPinInput.value.trim();
        if (/^bvv\.sams-ticker\.de\/detail\/.+/.test(v)) v = "https://" + v;
        if (!/^https:\/\/bvv\.sams-ticker\.de\/detail\/.+/.test(v)) {
          nfPinHint.textContent = "⚠️ Das sieht nicht nach einem Spiel-Link aus. Er sollte mit bvv.sams-ticker.de/detail/… beginnen (z. B. durch „URL kopieren“ im Ticker).";
          return;
        }
        setPin("nofilter", v);
        nfSetPinHint();
        nfFrame.src = "about:blank";
        setTimeout(() => { nfFrame.src = v; }, 50);
      };
      document.getElementById("nfPinClear").onclick = () => {
        setPin("nofilter", "");
        nfPinInput.value = "";
        nfSetPinHint();
        nfFrame.src = "about:blank";
        setTimeout(() => { nfFrame.src = nfTargetSrc(); }, 50);
      };

      const catRow = document.getElementById("catRow");
      const grpRow = document.getElementById("grpRow");
      const entryRow = document.getElementById("entryRow");

      function chip(label, active, onclick) {
        const b = document.createElement("button");
        b.className = "chip" + (active ? " active" : "");
        b.textContent = label;
        // stopPropagation: Klicks im Menür dürfen nie als "außerhalb"
        // gewertet werden (das Overlay-Karten-Innere wird bei jedem
        // Klick neu gerendert, sonst würde das Menü scheinbar willkürlich
        // zugehen)
        b.onclick = (ev) => { ev.stopPropagation(); onclick(); };
        return b;
      }

      function grpsOfCat(cat) {
        const set = [...new Set(CONFIG.filter((e) => e.cat === cat).map((e) => e.grp))];
        const order = GRP_ORDER[cat];
        set.sort((a, b) => order ? order.indexOf(a) - order.indexOf(b) : a.localeCompare(b, "de", { numeric: true }));
        return set;
      }

      function renderCatRow() {
        catRow.innerHTML = '<div class="rowlabel">1 · Bereich</div>';
        CATS.forEach((c) => {
          catRow.appendChild(chip(c.label, state.cat === c.id, () => {
            state.noFilter = false; // ASV-Auswahl aktiv -> Normalmodus
            state.cat = c.id;
            const g = state.lastGrpByCat[c.id];
            state.grp = (g && grpsOfCat(c.id).includes(g)) ? g : null;
            state.entry = state.grp !== null ? (state.lastEntryByGrp[c.id + "|" + state.grp] ?? null) : null;
            renderAll();
          }));
        });
      }

      function renderGrpRow() {
        grpRow.innerHTML = '<div class="rowlabel">2 · Mannschaft / Altersklasse</div>';
        if (state.cat === null) return;
        grpsOfCat(state.cat).forEach((g) => {
          grpRow.appendChild(chip(g, state.grp === g, () => {
            state.grp = g;
            rememberGrp(state.cat, g);
            state.entry = state.lastEntryByGrp[state.cat + "|" + g] ?? null;
            renderAll();
          }));
        });
      }

      function renderEntryRow() {
        entryRow.innerHTML = '<div class="rowlabel">3 · Team / Wettbewerb</div>';
        if (state.grp === null) return;
        CONFIG.filter((e) => e.cat === state.cat && e.grp === state.grp).forEach((e) => {
          const label = e.chip || shortLabel(e.team);
          entryRow.appendChild(chip(label, state.entry === e.idx, () => {
            state.entry = e.idx;
            rememberEntry(state.cat, state.grp, e.idx);
            renderAll(); // Menü bleibt offen (Schließen nur explizit)
          }));
        });
      }

      function grpsOfCat(cat) {
        const set = [...new Set(CONFIG.filter((e) => e.cat === cat).map((e) => e.grp))];
        const order = GRP_ORDER[cat];
        set.sort((a, b) => order ? order.indexOf(a) - order.indexOf(b) : a.localeCompare(b, "de", { numeric: true }));
        return set;
      }

      function showEntry() {
        document.querySelectorAll(".entry").forEach((p) => p.classList.remove("active"));
        if (state.noFilter) {
          noFilterView.classList.add("active");
          const nfSrc = nfTargetSrc();
          if (!nfFrame.src || nfFrame.src === "about:blank") nfFrame.src = nfSrc;
          return;
        }
        if (state.entry === null) return;
        const t = CONFIG[state.entry];
        t.el.classList.add("active");
        // Aktive Ansicht (Tab) gemäß globaler Auswahl setzen
        t.el.querySelectorAll(".tabpane").forEach((p) => p.classList.remove("active"));
        const pane = t.el.querySelector("#e-" + t.idx + "-" + (state.tab || "ticker"));
        if (pane) pane.classList.add("active");
        else t.el.querySelector("#e-" + t.idx + "-ticker").classList.add("active");
        // Ticker-iframe lazy laden (nur beim ersten Anzeigen) und beim
        // Teamwechsel frische Daten holen; Ziel = angepinntes Spiel
        // oder Liga-Ansicht
        const f = t.el.querySelector(".ticker-frame");
        const src = targetSrc(t);
        if (f.src !== src && f.src !== "about:blank") f.src = src;
        if (!f.src) f.src = src;
        // Fallback-Link aktuell halten
        t.el.querySelector(".fallback-link").href = src;
      }

      // Ansicht-Chips (Live-Ticker / Spielplan / Tabelle) im Menü
      const TABS = [
        { id: "ticker", label: "📡 Live-Ticker" },
        { id: "spiele", label: "📅 Spielplan" },
        { id: "tabelle", label: "📊 Tabelle" },
      ];
      function renderTabRow() {
        tabRow.innerHTML = "";
        if (!state.tab) state.tab = "ticker";
        // Bei externen Einträgen (z. B. BVV-Tagesübersicht) gibt es
        // keinen Spielplan/Tabelle -> nur den Ticker-Reiter zeigen
        const cur = state.entry !== null ? CONFIG[state.entry] : null;
        const tabs = (cur && cur.externalUrl) ? TABS.filter((x) => x.id === "ticker") : TABS;
        tabs.forEach((tb) => {
          tabRow.appendChild(chip(tb.label, state.tab === tb.id, () => {
            state.tab = tb.id;
            showEntry();
            saveState();
            renderAll();
          }));
        });
      }

      // Platzhalter, wenn noch nichts ausgewählt ist
      function renderPlaceholder() {
        let ph = document.getElementById("placeholder");
        if (!ph) {
          ph = document.createElement("div");
          ph.id = "placeholder";
          ph.className = "card";
          ph.style.display = "none";
          ph.innerHTML = '👋 Tippe oben auf <b>☰ Menü</b> und wähle deine Mannschaft – Live-Ticker, Spielplan und Tabelle erscheinen sofort.';
          teamview.appendChild(ph);
        }
        ph.style.display = (state.entry === null && !state.noFilter) ? "block" : "none";
      }

      function renderAll() {
        // Gespeicherte Auswahl validieren: existiert der Eintrag noch?
        if (state.entry !== null && !CONFIG[state.entry]) { state.entry = null; state.grp = null; state.cat = null; menuOpen = true; }
        if (state.entry !== null) {
          const e = CONFIG[state.entry];
          if (e.cat !== state.cat || e.grp !== state.grp) { state.entry = null; }
        }
        // Menü-Knopf: zeigt die aktuelle Auswahl, damit man sie ohne
        // Öffnen immer sieht
        if (state.noFilter) {
          menuBtnLabel.textContent = "🌐 Alle Spiele";
        } else if (state.entry !== null) {
          const e = CONFIG[state.entry];
          const cat = CATS.find((c) => c.id === state.cat);
          menuBtnLabel.textContent = (cat ? cat.label + " · " : "") + (state.grp || "") + " · " + (e.chip || shortLabel(e.team));
        } else if (state.cat !== null || state.grp !== null) {
          const cat = CATS.find((c) => c.id === state.cat);
          menuBtnLabel.textContent = [cat ? cat.label : "", state.grp || ""].filter(Boolean).join(" · ") || "Menü";
        } else {
          menuBtnLabel.textContent = "Menü";
        }
        menuBtn.classList.toggle("open", menuOpen);
        menuPanel.classList.toggle("open", menuOpen);
        tabRow.style.display = (state.entry !== null && !state.noFilter) ? "flex" : "none";
        renderCatRow();
        renderGrpRow();
        renderEntryRow();
        renderTabRow();
        showEntry();
        renderPlaceholder();
        // 📌-Knopf zeigt an, ob die aktive Ansicht einen Pin hat
        const hasPin = state.noFilter
          ? !!pinOf("nofilter")
          : (state.entry !== null ? !!pinOf(state.entry) : false);
        floatPin.classList.toggle("active", hasPin);
        updateFloatbar();
        saveState();
      }
      renderAll();

      // ---------------- Spielplan-Zeilen klickbar machen ----------------
      function linkifySchedules() {
        document.querySelectorAll(".vapi tr.spiel").forEach((row) => {
          if (row.dataset.linkified) return;
          const entryEl = row.closest(".entry");
          const id = entryEl ? entryEl.id.replace("entry-", "") : null;
          const t = CONFIG[Number(id)];
          const base = t ? detailBaseOf(t) : null;
          const sid = row.getAttribute("data-vapi-spielid");
          if (!base || !sid) return;
          row.dataset.linkified = "1";
          row.classList.add("clickable");
          row.title = "Spieldetails & Live-Ticker öffnen";
          row.addEventListener("click", () => window.open(base + sid, "_blank", "noopener"));
        });
      }
      setInterval(linkifySchedules, 1500);

      // ---------------- Fallback, falls Einbetten gesperrt ----------------
      setTimeout(() => {
        document.querySelectorAll(".ticker-frame").forEach((f) => {
          try { if (f.contentWindow === null) f.parentElement.querySelector(".fallback").style.display = "block"; }
          catch (e) { f.parentElement.querySelector(".fallback").style.display = "block"; }
        });
      }, 5000);
    </script>

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(function () { /* offline-first optional */ });
      }
    </script>
