name: Backend-Felder analysieren (Einmal-Probe)

on:
  push:
    paths:
      - ".github/workflows/probe-backend.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend laden und den Live-Match-State extrahieren
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS --compressed -m 150 \
              -H "Origin: https://bvv.sams-ticker.de" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
              -o /tmp/tickers.json \
              -w "%{http_code}" \
              https://backend.sams-ticker.de/live/indoor/tickers/bvv) || code="curl-fail"
            size=$(stat -c %s /tmp/tickers.json 2>/dev/null || echo 0)
            echo "Versuch $i: HTTP $code, $size Bytes"
            if [ "$code" = "200" ] && [ "$size" -gt 1000000 ]; then ok=1; break; fi
            sleep 45
          done
          if [ "$ok" != "1" ]; then
            echo '{ "stage": "download-fehler" }' > backend-probe.json
          else
          python3 - <<'PYEOF'
          import json, datetime, traceback
          MATCH_ID = "6ed3479d-d042-4e23-9978-70ea80392504"
          out = {"stage": "start", "matchId": MATCH_ID}
          try:
              data = json.load(open('/tmp/tickers.json'))
              ms = data.get("matchStates")
              st = data.get("matchStats")
              out["matchStates_type"] = type(ms).__name__

              # Alle Spiele sammeln
              all_matches = []
              for md in data.get("matchDays", []):
                  for m in md.get("matches", []):
                      all_matches.append(m)

              now = datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000

              # Das Zielspiel
              target = next((m for m in all_matches if m.get("id") == MATCH_ID), None)
              out["targetMatch"] = target

              # State des Zielspiels
              if isinstance(ms, dict):
                  out["targetState"] = ms.get(MATCH_ID)
              elif isinstance(ms, list):
                  out["targetState"] = next((s for s in ms if isinstance(s, dict) and s.get("id") == MATCH_ID or (isinstance(s, dict) and s.get("matchId") == MATCH_ID)), None)

              # Vergleichsproben: ein laufendes, ein zukuenftiges, ein beendetes Spiel
              def state_of(mid):
                  if isinstance(ms, dict):
                      return ms.get(mid)
                  if isinstance(ms, list):
                      for s in ms:
                          if isinstance(s, dict) and s.get("id") == mid:
                              return s
                  return None

              running = []
              past = []
              future = []
              for m in all_matches:
                  s = state_of(m.get("id")) or {}
                  bucket = "other"
                  if isinstance(s, dict):
                      bucket = s.get("state") or s.get("status") or "other"
                  d = m.get("date", 0)
                  if d > now + 3600000:
                      future.append((m, s))
                  elif d < now - 7200000:
                      past.append((m, s))
                  else:
                      running.append((m, s))
              out["counts"] = {"zukuenftig": len(future), "vergangen": len(past), "imZeitfenster": len(running)}
              out["beispiel_zukunft"] = {"match": future[0][0], "state": future[0][1]} if future else None
              out["beispiel_vergangen"] = {"match": past[0][0], "state": past[0][1]} if past else None
              out["alleStatesImZeitfenster"] = [
                  {"date": m.get("date"), "id": m.get("id"), "state": s} for (m, s) in running[:5]
              ]
              # matchStats fuer das Zielspiel
              if isinstance(st, dict):
                  out["targetStats"] = st.get(MATCH_ID)
              out["stage"] = "fertig"
          except Exception:
              out["error"] = traceback.format_exc()
          open("backend-probe.json", "w").write(json.dumps(out, ensure_ascii=False, indent=1, default=str))
          if "error" in out:
              raise SystemExit(1)
          PYEOF
          fi

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-probe.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Live-Match-State Analyse [bot]"
            git push
          fi
