name: Backend-Felder analysieren (Einmal-Probe)

on:
  push:
    paths:
      - ".github/workflows/probe-backend.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend laden und Tiefe 2 analysieren
        run: |
          set -e
          curl -sS --compressed -m 150 -w "HTTP %{http_code}, %{size_download} bytes\n" \
            -H "Origin: https://bvv.sams-ticker.de" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -o /tmp/tickers.json \
            https://backend.sams-ticker.de/live/indoor/tickers/bvv
          ls -l /tmp/tickers.json
          python3 - <<'PYEOF'
          import json, datetime, traceback
          out = {"stage": "start"}
          try:
              data = json.load(open('/tmp/tickers.json'))
              out["stage"] = "geladen"

              def keyset(objs):
                  s = set()
                  for o in objs:
                      if isinstance(o, dict):
                          s.update(o.keys())
                  return sorted(s)

              ms = data.get("matchStates")
              if isinstance(ms, list):
                  out["matchStates_type"] = "list"
                  out["matchStates_len"] = len(ms)
                  out["matchStates_keys"] = keyset(ms)
                  out["matchStates_samples"] = ms[:3]
              elif isinstance(ms, dict):
                  out["matchStates_type"] = "dict"
                  out["matchStates_len"] = len(ms)
                  out["matchStates_keys"] = keyset(list(ms.values()))
                  out["matchStates_samples"] = dict(list(ms.items())[:3])

              sr = data.get("matchSeries")
              if isinstance(sr, list):
                  out["matchSeries_type"] = "list"
                  out["matchSeries_len"] = len(sr)
                  out["matchSeries_keys"] = keyset(sr)
                  out["matchSeries_samples"] = sr[:2]
              elif isinstance(sr, dict):
                  out["matchSeries_type"] = "dict"
                  out["matchSeries_len"] = len(sr)
                  out["matchSeries_samples"] = dict(list(sr.items())[:2])

              st = data.get("matchStats")
              if isinstance(st, list):
                  out["matchStats_type"] = "list"
                  out["matchStats_len"] = len(st)
                  out["matchStats_keys"] = keyset(st)
                  out["matchStats_samples"] = st[:2]
              elif isinstance(st, dict):
                  out["matchStats_type"] = "dict"
                  out["matchStats_len"] = len(st)
                  out["matchStats_samples"] = dict(list(st.items())[:2])

              out["settings_keys"] = sorted(data.get("settings", {}).keys()) if isinstance(data.get("settings"), dict) else type(data.get("settings")).__name__

              all_matches = []
              for md in data.get("matchDays", []):
                  for m in md.get("matches", []):
                      all_matches.append(m)
              dates = [m["date"] for m in all_matches]
              asv = [m for m in all_matches if "ASV Dachau" in (m.get("teamDescription1") or "") or "ASV Dachau" in (m.get("teamDescription2") or "")]
              def fmt(x):
                  return datetime.datetime.fromtimestamp(x/1000, datetime.timezone(datetime.timedelta(hours=1))).isoformat()
              out["matchCount"] = len(all_matches)
              out["dateMin"] = fmt(min(dates)) if dates else None
              out["dateMax"] = fmt(max(dates)) if dates else None
              out["asvCount"] = len(asv)
              out["asvSeries"] = sorted(set(m["matchSeries"] for m in asv))
              out["asvDateRange"] = [fmt(min(m["date"] for m in asv)), fmt(max(m["date"] for m in asv))] if asv else None
              out["stage"] = "fertig"
          except Exception:
              out["error"] = traceback.format_exc()
          open("backend-probe.json", "w").write(json.dumps(out, ensure_ascii=False, indent=1))
          if "error" in out:
              raise SystemExit(1)
          PYEOF

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-probe.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Backend Tiefe-2-Analyse [bot]"
            git push
          fi
