name: Ticker-Index aktualisieren

on:
  schedule:
    - cron: "23 5 * * 4"        # donnerstags 06:23 MEZ
    - cron: "*/15 * * * 6,0"    # samstags/sonntags alle 15 Minuten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticker-index
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ticker-Backend laden (mit Validierung)
        id: load
        run: |
          set +e
          ok=0
          for i in 1 2 3; do
            curl -sS --compressed -f -m 150 \
              -H "Origin: https://bvv.sams-ticker.de" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              https://backend.sams-ticker.de/live/indoor/tickers/bvv -o /tmp/tickers.json
            rc=$?
            if [ $rc -eq 0 ]; then ok=1; break; fi
            echo "Download-Versuch $i fehlgeschlagen (curl rc=$rc)."
            [ $i -lt 3 ] && sleep 90
          done
          if [ $ok -eq 1 ] && ! python3 -c "import json;json.load(open('/tmp/tickers.json'))"; then
            echo "::warning::Antwort ist kein gueltiges JSON. Kein Update, kein Commit."
            ok=0
          fi
          if [ $ok -eq 1 ] && ! python3 -c "import json;d=json.load(open('/tmp/tickers.json'));n=sum(len(md['matches']) for md in d['matchDays']);exit(0 if n>=200 else 1)"; then
            n=$(python3 -c "import json;d=json.load(open('/tmp/tickers.json'));print(sum(len(md['matches']) for md in d['matchDays']))")
            echo "::warning::Nur $n Matches (erwartbar >1000) - vermutlich unvollstaendiger Download. Kein Update, kein Commit."
            ok=0
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ $ok -eq 0 ]; then
            echo "::warning::Ticker-Backend blockiert/unbrauchbar - Update uebersprungen, kein Commit. Der naechste Lauf versucht erneut."
            echo ""
            echo "==================== DIAGNOSE START ===================="
            echo "Runner-Umgebung:"
            echo "  curl: $(curl --version | head -1)"
            echo "  Egress-IP: $(curl -s -m 15 https://api.ipify.org || echo 'unbekannt')"
            echo ""
            echo "--- Kontroll-Abruf 1: bvv.sams-ticker.de Startseite (erwartet 200):"
            curl -sS -m 30 -o /dev/null -w "  HTTP %{http_code}, remote_ip=%{remote_ip}
" https://bvv.sams-ticker.de/ || echo "  fehlgeschlagen"
            echo ""
            echo "--- Kontroll-Abruf 2: Backend OHNE Origin-Header (erwartet 403):"
            curl -sS --compressed -m 60 -o /dev/null -w "  HTTP %{http_code}
" https://backend.sams-ticker.de/live/indoor/tickers/bvv || echo "  fehlgeschlagen"
            echo ""
            echo "--- Kontroll-Abruf 3: Backend MIT bvv-Origin (der eigentliche Fall):"
            curl -sS --compressed -m 60 -D /tmp/diag_hdr.txt \
              -H "Origin: https://bvv.sams-ticker.de" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              https://backend.sams-ticker.de/live/indoor/tickers/bvv -o /tmp/diag_body.txt || echo "  curl-Fehler (rc=$?)"
            echo "  Response-Header:"
            sed 's/^/    /' /tmp/diag_hdr.txt || true
            echo "  Body (erste 2500 Zeichen):"
            head -c 2500 /tmp/diag_body.txt | sed 's/^/    /' || true
            echo ""
            echo "==================== DIAGNOSE ENDE ===================="
          else
            echo "Download erfolgreich."
          fi
          exit 0

      - name: Ticker-Index und ASV-Wettbewerbe erzeugen
        if: steps.load.outputs.ok == '1'
        run: |
          python3 - <<'PYEOF'
          import json
          data = json.load(open('/tmp/tickers.json'))
          states = data.get("matchStates") or {}
          slim = {"matchDays": []}
          asv_series = {}
          for md in data.get("matchDays", []):
              ms = []
              for m in md.get("matches", []):
                  item = {"id": m["id"], "teamDescription1": m["teamDescription1"],
                          "teamDescription2": m["teamDescription2"], "date": m["date"],
                          "matchSeries": m["matchSeries"]}
                  # Live-Flags aus matchStates (Key = Spiel-Id):
                  # st=1 gestartet, fi=1 beendet. App: live = st==1 und
                  # fi!=1 und Spiel ist heute (Berlin) - schliesst
                  # wochenlang offene Ticker (Amper-Fall) aus.
                  st = states.get(m["id"])
                  if st:
                      item["st"] = 1 if st.get("started") else 0
                      item["fi"] = 1 if st.get("finished") else 0
                  ms.append(item)
                  if "ASV Dachau" in m["teamDescription1"] or "ASV Dachau" in m["teamDescription2"]:
                      entry = asv_series.setdefault(m["matchSeries"], {
                          "wettbewerb": m["matchSeries"], "spiele": 0,
                          "asvTeams": set(), "gegnerBeispiele": []})
                      entry["spiele"] += 1
                      for team, other in ((m["teamDescription1"], m["teamDescription2"]),
                                          (m["teamDescription2"], m["teamDescription1"])):
                          if "ASV Dachau" in team:
                              entry["asvTeams"].add(team)
                              if other not in entry["gegnerBeispiele"] and len(entry["gegnerBeispiele"]) < 5:
                                  entry["gegnerBeispiele"].append(other)
              if ms:
                  slim["matchDays"].append({"matches": ms})
          open("ticker-index.json", "w").write(json.dumps(slim, ensure_ascii=False, separators=(",", ":")))
          out = {"stand": "automatisch generiert",
                 "wettbewerbe": [dict(v, asvTeams=sorted(v["asvTeams"])) for v in asv_series.values()]}
          open("asv-wettbewerbe.json", "w").write(json.dumps(out, ensure_ascii=False, indent=1))
          PYEOF

      - name: Committen, falls geändert
        if: steps.load.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ticker-index.json asv-wettbewerbe.json
          # ticker-raw.json nur donnerstags mitcommitten (Repo-Groesse!)
          if [ "$(date -u +%u)" = "4" ]; then
            cp /tmp/tickers.json ticker-raw.json
            git add ticker-raw.json
          fi
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Ticker-Index + ASV-Wettbewerbe aktualisieren [bot]"
            git push
